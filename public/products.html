<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroDesk - Products</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f1f5ee; }
    header { background: #2e6b34; color: #fff; padding: 14px 24px; display: flex;
             justify-content: space-between; align-items: center; }
    header a { color: #fff; text-decoration: none; }
    main { padding: 24px; max-width: 1100px; margin: auto; }
    .box { background: #fff; padding: 18px; border-radius: 10px; margin-bottom: 20px;
           box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    h2, h3 { margin-top: 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input, select { padding: 9px; border: 1px solid #bbb; border-radius: 6px; }
    .row input, .row select { flex: 1; min-width: 150px; }
    button { padding: 9px 14px; border: 0; border-radius: 6px; background: #2e6b34;
             color: #fff; cursor: pointer; }
    button.grey { background: #777; }
    button.red { background: #b00020; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px; border-bottom: 1px solid #e2e2e2; font-size: 14px; }
    th { background: #e3f1e4; }
    #msg { min-height: 20px; margin: 8px 0; font-size: 14px; }
    .ok { color: #2e6b34; } .err { color: #b00020; }
  </style>
</head>
<body>
  <header>
    <strong>AgroDesk - Products</strong>
    <a href="/dashboard.html">Back to dashboard</a>
  </header>
  <main>
    <div class="box" id="formBox" style="display:none">
      <h3 id="formTitle">Add product</h3>
      <form id="form">
        <div class="row">
          <input id="name" placeholder="Product name" required>
          <select id="category" required>
            <option value="">Category</option>
            <option value="seed">Seed</option>
            <option value="fertilizer">Fertilizer</option>
            <option value="pesticide">Pesticide</option>
          </select>
          <input id="unit" placeholder="Unit (kg, litre, packet)" required>
        </div>
        <div class="row" style="margin-top:10px">
          <input id="manufacturer" placeholder="Manufacturer">
          <input id="hsn_code" placeholder="HSN code">
          <input id="tax_rate" type="number" step="0.01" min="0" max="100" placeholder="Tax rate %">
          <input id="waiting_period_days" type="number" min="0" placeholder="Waiting period (days)" disabled>
        </div>
        <div style="margin-top:12px">
          <button type="submit" id="saveBtn">Save product</button>
          <button type="button" class="grey" id="cancelBtn">Clear</button>
        </div>
      </form>
    </div>

    <div id="msg"></div>

    <div class="box">
      <div class="row" style="margin-bottom:12px">
        <input id="search" placeholder="Search by name or manufacturer">
        <select id="filter">
          <option value="">All categories</option>
          <option value="seed">Seed</option>
          <option value="fertilizer">Fertilizer</option>
          <option value="pesticide">Pesticide</option>
        </select>
      </div>
      <table>
        <thead>
          <tr><th>Name</th><th>Category</th><th>Unit</th><th>Manufacturer</th>
              <th>Tax %</th><th>Waiting (days)</th><th class="ownerOnly"></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!token || !user) window.location.href = '/login.html';
    const isOwner = user && user.role === 'owner';

    let products = [];
    let editingId = null;
    const $ = (id) => document.getElementById(id);

    function show(text, ok) {
      $('msg').textContent = text;
      $('msg').className = ok ? 'ok' : 'err';
    }

    async function api(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }
      });
      if (res.status === 401) { localStorage.clear(); window.location.href = '/login.html'; }
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Something went wrong');
      return data;
    }

    async function load() {
      const q = new URLSearchParams({ search: $('search').value.trim(), category: $('filter').value });
      try {
        products = await api('/api/products?' + q);
        render();
      } catch (e) { show(e.message, false); }
    }

    function render() {
      const body = $('rows');
      body.innerHTML = '';
      if (!products.length) {
        const tr = body.insertRow();
        const td = tr.insertCell();
        td.colSpan = 7;
        td.textContent = 'No products found';
        return;
      }
      products.forEach(p => {
        const tr = body.insertRow();
        [p.name, p.category, p.unit, p.manufacturer || '-', p.tax_rate,
         p.waiting_period_days ?? '-'].forEach(v => { tr.insertCell().textContent = v; });
        const actions = tr.insertCell();
        if (isOwner) {
          const edit = document.createElement('button');
          edit.textContent = 'Edit';
          edit.onclick = () => startEdit(p);
          const del = document.createElement('button');
          del.textContent = 'Delete';
          del.className = 'red';
          del.style.marginLeft = '6px';
          del.onclick = () => remove(p);
          actions.append(edit, del);
        }
      });
    }

    function startEdit(p) {
      editingId = p.product_id;
      $('formTitle').textContent = 'Edit product';
      $('name').value = p.name;
      $('category').value = p.category;
      $('unit').value = p.unit;
      $('manufacturer').value = p.manufacturer || '';
      $('hsn_code').value = p.hsn_code || '';
      $('tax_rate').value = p.tax_rate;
      $('waiting_period_days').value = p.waiting_period_days ?? '';
      toggleWaiting();
      window.scrollTo(0, 0);
    }

    function clearForm() {
      editingId = null;
      $('form').reset();
      $('formTitle').textContent = 'Add product';
      toggleWaiting();
    }

    function toggleWaiting() {
      const isPest = $('category').value === 'pesticide';
      $('waiting_period_days').disabled = !isPest;
      if (!isPest) $('waiting_period_days').value = '';
    }

    async function remove(p) {
      if (!confirm('Delete ' + p.name + '?')) return;
      try {
        const r = await api('/api/products/' + p.product_id, { method: 'DELETE' });
        show(r.message, true);
        load();
      } catch (e) { show(e.message, false); }
    }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: $('name').value, category: $('category').value, unit: $('unit').value,
        manufacturer: $('manufacturer').value, hsn_code: $('hsn_code').value,
        tax_rate: $('tax_rate').value, waiting_period_days: $('waiting_period_days').value
      };
      try {
        const r = editingId
          ? await api('/api/products/' + editingId, { method: 'PUT', body: JSON.stringify(body) })
          : await api('/api/products', { method: 'POST', body: JSON.stringify(body) });
        show(r.message, true);
        clearForm();
        load();
      } catch (err) { show(err.message, false); }
    });

    $('category').addEventListener('change', toggleWaiting);
    $('cancelBtn').addEventListener('click', clearForm);
    $('search').addEventListener('input', load);
    $('filter').addEventListener('change', load);

    if (isOwner) $('formBox').style.display = 'block';
    else document.querySelectorAll('.ownerOnly').forEach(el => el.style.display = 'none');
    load();
  </script>
</body>
</html>
