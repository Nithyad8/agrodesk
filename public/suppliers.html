<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgroDesk - Suppliers</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f1f5ee; }
    header { background: #2e6b34; color: #fff; padding: 14px 24px; display: flex;
             justify-content: space-between; align-items: center; }
    header a { color: #fff; text-decoration: none; }
    main { padding: 24px; max-width: 1000px; margin: auto; }
    .box { background: #fff; padding: 18px; border-radius: 10px; margin-bottom: 20px;
           box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    h3 { margin-top: 0; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input { padding: 9px; border: 1px solid #bbb; border-radius: 6px; flex: 1; min-width: 160px; }
    button { padding: 9px 14px; border: 0; border-radius: 6px; background: #2e6b34; color: #fff; cursor: pointer; }
    button.grey { background: #777; } button.red { background: #b00020; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px; border-bottom: 1px solid #e2e2e2; font-size: 14px; }
    th { background: #e3f1e4; }
    #msg { min-height: 20px; margin: 8px 0; font-size: 14px; }
    .ok { color: #2e6b34; } .err { color: #b00020; }
  </style>
</head>
<body>
  <header><strong>AgroDesk - Suppliers</strong><a href="/dashboard.html">Back to dashboard</a></header>
  <main>
    <div class="box" id="formBox" style="display:none">
      <h3 id="formTitle">Add supplier</h3>
      <form id="form">
        <div class="row">
          <input id="name" placeholder="Supplier name" required>
          <input id="contact" placeholder="Phone or email">
          <input id="address" placeholder="Address">
        </div>
        <div style="margin-top:12px">
          <button type="submit">Save supplier</button>
          <button type="button" class="grey" id="cancelBtn">Clear</button>
        </div>
      </form>
    </div>
    <div id="msg"></div>
    <div class="box">
      <input id="search" placeholder="Search suppliers" style="width:100%;box-sizing:border-box;margin-bottom:12px">
      <table>
        <thead><tr><th>Name</th><th>Contact</th><th>Address</th><th class="ownerOnly"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!token || !user) window.location.href = '/login.html';
    const isOwner = user && user.role === 'owner';
    let list = [], editingId = null;
    const $ = (id) => document.getElementById(id);
    const show = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : 'err'; };

    async function api(url, options = {}) {
      const res = await fetch(url, { ...options,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token } });
      if (res.status === 401) { localStorage.clear(); window.location.href = '/login.html'; }
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Something went wrong');
      return data;
    }
    async function load() {
      try {
        list = await api('/api/suppliers?search=' + encodeURIComponent($('search').value.trim()));
        render();
      } catch (e) { show(e.message, false); }
    }
    function render() {
      const body = $('rows'); body.innerHTML = '';
      if (!list.length) { const td = body.insertRow().insertCell(); td.colSpan = 4; td.textContent = 'No suppliers found'; return; }
      list.forEach(s => {
        const tr = body.insertRow();
        [s.name, s.contact || '-', s.address || '-'].forEach(v => { tr.insertCell().textContent = v; });
        const a = tr.insertCell();
        if (isOwner) {
          const e = document.createElement('button'); e.textContent = 'Edit'; e.onclick = () => startEdit(s);
          const d = document.createElement('button'); d.textContent = 'Delete'; d.className = 'red';
          d.style.marginLeft = '6px'; d.onclick = () => remove(s);
          a.append(e, d);
        }
      });
    }
    function startEdit(s) {
      editingId = s.supplier_id; $('formTitle').textContent = 'Edit supplier';
      $('name').value = s.name; $('contact').value = s.contact || ''; $('address').value = s.address || '';
      window.scrollTo(0, 0);
    }
    function clearForm() { editingId = null; $('form').reset(); $('formTitle').textContent = 'Add supplier'; }
    async function remove(s) {
      if (!confirm('Delete ' + s.name + '?')) return;
      try { show((await api('/api/suppliers/' + s.supplier_id, { method: 'DELETE' })).message, true); load(); }
      catch (e) { show(e.message, false); }
    }
    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = JSON.stringify({ name: $('name').value, contact: $('contact').value, address: $('address').value });
      try {
        const r = editingId
          ? await api('/api/suppliers/' + editingId, { method: 'PUT', body })
          : await api('/api/suppliers', { method: 'POST', body });
        show(r.message, true); clearForm(); load();
      } catch (err) { show(err.message, false); }
    });
    $('cancelBtn').addEventListener('click', clearForm);
    $('search').addEventListener('input', load);
    if (isOwner) $('formBox').style.display = 'block';
    else document.querySelectorAll('.ownerOnly').forEach(el => el.style.display = 'none');
    load();
  </script>
</body>
</html>
